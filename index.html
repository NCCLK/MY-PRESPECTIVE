:root{--bg:#f4f6fb;--c:#fff;--t:#1e293b;--m:#64748b;--b:#e2e8f0;--p:#4f46e5;--g:#10b981;--r:#ef4444;--o:#f59e0b}
@media(prefers-color-scheme:dark){:root{--bg:#0f172a;--c:#1e293b;--t:#e2e8f0;--m:#94a3b8;--b:#334155}}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--t)}
header{background:linear-gradient(135deg,#312e81,#4f46e5 60%,#06b6d4);color:#fff;padding:14px 20px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
header h1{margin:0;font-size:20px}header small{opacity:.85}
button,select,input{font:inherit;color:var(--t);background:var(--c);border:1px solid var(--b);border-radius:8px;padding:6px 10px}button{cursor:pointer}button:hover{border-color:var(--p)}
header button{background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.3)}
#flt{position:sticky;top:0;z-index:20;background:var(--c);border-bottom:1px solid var(--b);padding:10px 20px;display:flex;flex-wrap:wrap;gap:10px;align-items:end}
#flt label{display:flex;flex-direction:column;font-size:11px;color:var(--m);gap:2px}
details.dd{position:relative}details.dd summary{cursor:pointer;border:1px solid var(--b);border-radius:8px;padding:6px 10px;list-style:none;min-width:170px}
.ddl{position:absolute;top:36px;left:0;background:var(--c);border:1px solid var(--b);border-radius:10px;padding:8px;max-height:320px;overflow:auto;width:250px;box-shadow:0 10px 30px #0004;z-index:30}
.ddl label{flex-direction:row;align-items:center;gap:6px;font-size:13px;color:var(--t);padding:2px 0}
nav{display:flex;gap:4px;padding:10px 20px 0;overflow-x:auto}nav button{border-radius:8px 8px 0 0;border-bottom:none;white-space:nowrap}nav button.on{background:var(--p);color:#fff;border-color:var(--p)}
main{padding:14px 20px 40px}.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));margin-bottom:14px}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:14px}
.k{background:var(--c);border:1px solid var(--b);border-left:4px solid var(--p);border-radius:12px;padding:12px}.k b{display:block;font-size:22px}.k span{color:var(--m);font-size:12px}.k i{font-style:normal;font-size:11px;color:var(--m);display:block}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:12px;min-width:0}.card h3{margin:0 0 8px;font-size:14px}.cv{position:relative;height:270px}
.th{display:flex;gap:10px;align-items:center;margin-bottom:8px}.th b{flex:1}.th span{color:var(--m);font-size:12px}
.tw{overflow:auto;max-height:520px}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:6px 8px;border-bottom:1px solid var(--b);text-align:left;white-space:nowrap}th{position:sticky;top:0;background:var(--c);cursor:pointer;color:var(--m);font-size:12px}td.n,th.n{text-align:right}
.pg{display:flex;gap:6px;align-items:center;justify-content:flex-end;margin-top:8px;color:var(--m)}
.tag{padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;color:#fff}.pill{display:inline-block;padding:3px 10px;border-radius:99px;background:var(--bg);border:1px solid var(--b);margin:2px;font-size:12px}
#st{padding:6px 20px;font-size:12px;color:var(--m)}.warn{background:#fef3c7;color:#92400e;padding:8px 14px;border-radius:8px;margin:8px 20px}
code{background:var(--bg);padding:1px 6px;border-radius:5px}.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.flow div{background:var(--p);color:#fff;padding:8px 12px;border-radius:10px;font-size:13px}

 <tr><td><b>Warranty</b></td><td><code>WMS1001…</code> sequential case no., linked via NCC REF (the sales ref), logged with the employee code.</td></tr></table></div>
 <div class="card"><h3>How the numbers are calculated</h3><ul><li><b>Sale type</b>: Other-2 empty → Cash · ends “PN” → PN · otherwise EP (same rule as your Dashboard sheet).</li><li><b>Sale date</b> = Issued date (fallback invoice date). Pre-numbered empty rows are ignored.</li><li><b>EP outstanding</b> = Invoice − Total paid. <b>Overdue</b> = (Down pmt + instalment × instalments already due) − paid, where instalment = (Invoice − Down) ÷ No. of Ins and due dates = down-payment date +1,2,3… months.</li><li><b>Collected per month</b> = recorded instalment/down-payment amounts by their payment date.</li><li>Model/category/spec are filled from MPL-STR via the serial no. when SLR is blank.</li></ul></div>
 <div class="card"><h3>Data quality (live)</h3><ul><li>Cash sales with no amount: <b>${N(S.filter(x=>x.type=='Cash'&&!x.amt).length)}</b></li><li>Sales with no date: <b>${N(S.filter(x=>!x.date).length)}</b> (hidden when a date filter is active)</li><li>EP sales in SLR with no ACS contract: <b>${N(miss)}</b> · ACS contracts not in SLR: <b>${N(acsNo)}</b></li><li>ACS rows flagged by sheet checks: ${dq.map(x=>`<span class="pill">${esc(x[0])} × ${x[1]}</span>`).join('')||'none'}</li><li>Sales with no seller code: <b>${N(S.filter(x=>!x.code).length)}</b></li></ul></div></div>`;return h}};
// ---------- app ----------
let cur='Overview';
function render(){CH.forEach(c=>c.destroy());CH=[];POST=[];D.slrm=D.slrm||Object.fromEntries(D.slr.map(x=>[x.ref,x]));try{$('#view').innerHTML=TABS[cur]();POST.forEach(f=>f())}catch(e){$('#view').innerHTML='<div class="warn">Render error: '+esc(e.message)+'</div>';console.error(e)}
 $('#nav').innerHTML=Object.keys(TABS).map(t=>`<button class="${t==cur?'on':''}" data-t="${t}">${t}</button>`).join('');$('#cS').textContent=F.codes.size?[...F.codes].slice(0,3).join(', ')+(F.codes.size>3?' +'+(F.codes.size-3):''):'All codes'}
function codeList(){$('#cL').innerHTML=`<button data-cc="bc">All BC (employees)</button> <button data-cc="clr">Clear</button>`+D.codes.map(c=>`<label><input type="checkbox" value="${c}" ${F.codes.has(c)?'checked':''}> ${c} <small style="color:var(--m)">${grpOf(c)=='Employee (BC)'?'👤':'🤝'}</small></label>`).join('')}
function preset(v){const n=new Date(),y=n.getFullYear();let f=null,t=null;if(v=='m')f=new Date(y,n.getMonth(),1);else if(v=='y')f=new Date(y,0,1);else if(v=='ly')f=new Date(y-1,0,1),t=new Date(y-1,11,31);else if(+v){f=new Date(n);f.setDate(f.getDate()-v)}
 if(v!='c'){F.from=f;F.to=t;const s=d=>d?d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'):'';$('#fF').value=s(f);$('#fT').value=s(t)}}
function reset(){F.codes.clear();F.type='all';F.q='';F.hide=false;$('#fP').value='all';preset('all');$('#fY').value='all';$('#fQ').value='';$('#fX').checked=false;codeList();Object.values(TB).forEach(t=>{t.page=0;t.sort=null});render()}
function status(src,ts){$('#st').innerHTML=`Data source: <b>${src}</b> · ${ts} · ${N(D.slr.length)} sales · ${N(D.acs.length)} EP contracts · ${N(D.str.length)} stock · ${N(D.wr.length)} warranty cases`}
async function live(){const raw={};await Promise.all(Object.entries(CFG.tabs).map(async([k,n])=>{const r=await fetch(`https://docs.google.com/spreadsheets/d/${CFG.id}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(n)}`);const t=await r.text();if(!r.ok||/^\s*</.test(t))throw new Error('Sheet not readable (share it as “Anyone with the link – Viewer”)');raw[k]=csv(t)}));return raw}
async function load(forceLive){$('#st').textContent='Loading…';let raw,src;try{raw=await live();src='Google Sheet (live)';$('#warn').innerHTML=''}catch(e){if(!SNAP){$('#warn').innerHTML='<div class="warn">'+esc(e.message)+'</div>';return}raw=SNAP;src='Embedded snapshot';$('#warn').innerHTML=`<div class="warn">Could not read the Google Sheet (${esc(e.message)}). Showing the embedded snapshot from ${SNAP_TS}. Set the sheet to “Anyone with the link can view”, then press Refresh.</div>`}
 build(raw);codeList();status(src,new Date().toLocaleString());render()}
document.addEventListener('click',e=>{const t=e.target;if(t.dataset.t){cur=t.dataset.t;render()}
 if(t.dataset.s){const[id,i]=t.dataset.s.split('|'),b=TB[id];b.dir=b.sort==+i?-b.dir:1;b.sort=+i;drawT(id)}
 if(t.dataset.pg){const[id,d]=t.dataset.pg.split('|');TB[id].page=Math.max(0,TB[id].page+ +d);drawT(id)}
 if(t.dataset.x){const b=TB[t.dataset.x],q=v=>'"'+String(v??'').replace(/"/g,'""')+'"',rows=[b.cols.map(c=>q(c.h)).join(',')].concat(b.rows.map(r=>b.cols.map(c=>q(c.d?c.d(r):c.f(r))).join(',')));const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.join('\n')],{type:'text/csv'}));a.download=t.dataset.x+'.csv';a.click()}
 if(t.dataset.cc){if(t.dataset.cc=='bc')D.codes.filter(c=>grpOf(c)=='Employee (BC)').forEach(c=>F.codes.add(c));else F.codes.clear();codeList();render()}});
$('#cL').addEventListener('change',e=>{e.target.checked?F.codes.add(e.target.value):F.codes.delete(e.target.value);render()});
$('#fP').onchange=e=>{preset(e.target.value);render()};$('#fF').onchange=e=>{F.from=e.target.value?new Date(e.target.value+'T00:00'):null;$('#fP').value='c';render()};$('#fT').onchange=e=>{F.to=e.target.value?new Date(e.target.value+'T00:00'):null;$('#fP').value='c';render()};
$('#fY').onchange=e=>{F.type=e.target.value;render()};let qt;$('#fQ').oninput=e=>{clearTimeout(qt);qt=setTimeout(()=>{F.q=e.target.value.toLowerCase().trim();render()},250)};$('#fX').onchange=e=>{F.hide=e.target.checked;render()};$('#fR').onclick=reset;$('#bR').onclick=()=>load(true);
$('#bS').onclick=()=>{const v=prompt('Google Sheet ID (the long text in the sheet URL between /d/ and /edit):',CFG.id);if(v){localStorage.setItem('sid',v.trim());CFG.id=v.trim();load(true)}};
$('#bU').onclick=()=>$('#fU').click();
$('#fU').onchange=async e=>{const f=e.target.files[0];if(!f)return;if(!window.XLSX)await new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)});
 const wb=XLSX.read(await f.arrayBuffer(),{cellDates:true}),raw={};for(const[k,n]of Object.entries(CFG.tabs)){const ws=wb.Sheets[n];raw[k]=ws?XLSX.utils.sheet_to_json(ws,{header:1,raw:false,dateNF:'dd/mm/yyyy',defval:''}):[]}build(raw);codeList();status('Uploaded file: '+f.name,new Date().toLocaleString());$('#warn').innerHTML='';render()};
document.addEventListener('click',e=>{const d=document.querySelector('details.dd');if(d&&!d.contains(e.target))d.open=false});
load();
</script></body></html>
